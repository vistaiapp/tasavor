name: Build Debug APK (all flavors)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      # BAZAAR_RSA_KEY / MYKET_RSA_KEY: از پنل هرکدام (Bazaar/Myket) دریافت
      # می‌شوند و باید در Settings → Secrets and variables → Actions ریپو
      # به همین نام ذخیره شوند. فلیور direct به هیچ‌کدام نیاز ندارد.
      - name: Build debug APKs (bazaar, myket, direct)
        env:
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
          MYKET_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: ./gradlew assembleDebug

      - name: Upload APK artifacts (all flavors)
        uses: actions/upload-artifact@v4
        with:
          name: tasavor-debug-apks
          path: |
            app/build/outputs/apk/bazaar/debug/*.apk
            app/build/outputs/apk/myket/debug/*.apk
            app/build/outputs/apk/direct/debug/*.apk
